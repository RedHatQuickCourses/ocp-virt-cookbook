apiVersion: v1
kind: Pod
metadata:
  name: rwx-probe
  namespace: migration-storage
spec:
  containers:
    - name: probe
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command:
        - sleep
        - "600"
      volumeDevices:
        - name: probe-disk
          devicePath: /dev/xvda
  volumes:
    - name: probe-disk
      persistentVolumeClaim:
        claimName: rwx-probe
