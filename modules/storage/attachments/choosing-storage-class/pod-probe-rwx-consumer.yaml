apiVersion: v1
kind: Pod
metadata:
  name: probe-rwx-consumer
  namespace: storage-selection-demo
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command:
        - sleep
        - "600"
      volumeDevices:
        - name: blk
          devicePath: /dev/probe
  volumes:
    - name: blk
      persistentVolumeClaim:
        claimName: probe-rwx
