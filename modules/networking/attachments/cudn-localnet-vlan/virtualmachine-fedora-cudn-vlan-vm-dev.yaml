apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-cudn-vlan-vm-dev
  namespace: vm-guests-vlan-dev
  labels:
    app: fedora-cudn-vlan-vm-dev
spec:
  runStrategy: Always
  instancetype:
    name: u1.small
  preference:
    name: fedora
  dataVolumeTemplates:
  - metadata:
      name: fedora-cudn-vlan-volume-dev
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 33Gi
      sourceRef:
        kind: DataSource
        name: fedora
        namespace: openshift-virtualization-os-images
  template:
    metadata:
      labels:
        app: fedora-cudn-vlan-vm-dev
    spec:
      domain:
        devices:
          disks:
          - name: datavolumedisk
            disk: {}
          - name: cloudinitdisk
            disk: {}
          interfaces:
          - name: default
            bridge: {}
          - name: cudn_vlan_network
            bridge: {}
      networks:
      - name: default
        pod: {}
      - name: cudn_vlan_network
        multus:
          networkName: cudn-localnet-vlan-100
      volumes:
      - name: datavolumedisk
        dataVolume:
          name: fedora-cudn-vlan-volume-dev
      - name: cloudinitdisk
        cloudInitNoCloud:
          networkData: |
            version: 2
            ethernets:
              enp2s0:
                addresses: ["192.168.100.20/24"]
          userData: |
            #cloud-config
            user: fedora
            password: fedora
            chpasswd:
              expire: false
            packages:
            - python3
            - tcpdump
            - net-tools
            write_files:
            - path: /root/index.html
              content: |
                <h1>Welcome to OpenShift Virtualization CUDN VLAN Network!</h1>
                <p>VLAN ID: 100</p>
                <p>Static IP: 192.168.100.20/24</p>
                <p>Network: CUDN Localnet</p>
                <p>Namespace: vm-guests-vlan-dev</p>
              permissions: '0644'
            runcmd:
            - nohup python3 -m http.server 8080 --directory /root > /dev/null 2>&1 &
