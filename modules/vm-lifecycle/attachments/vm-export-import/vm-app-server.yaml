apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: app-server
  namespace: vm-export-demo
  labels:
    app: app-server
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: app-server
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          rng: {}
        memory:
          guest: 2Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: app-server-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: fedora
              password: fedora123
              chpasswd:
                expire: false
              ssh_pwauth: true
  dataVolumeTemplates:
    - metadata:
        name: app-server-root
      spec:
        source:
          registry:
            url: "docker://quay.io/containerdisks/fedora:latest"
        storage:
          resources:
            requests:
              storage: 10Gi
