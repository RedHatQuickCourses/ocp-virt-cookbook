apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-nested
  namespace: nested-virt-demo
spec:
  runStrategy: Always
  template:
    spec:
      nodeSelector:
        nested-virt: "true"
      domain:
        cpu:
          sockets: 2
          cores: 1
          threads: 1
          features:
          - name: vmx
            policy: optional
          - name: svm
            policy: optional
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/fedora:latest
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            password: redhat
            chpasswd:
              expire: false
            packages:
            - qemu-kvm
