apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: custom-instancetype-demo
  namespace: instancetype-demo
spec:
  instancetype:
    name: app-server-4c8g
    kind: VirtualMachineInstancetype
  preference:
    name: my-linux-server
    kind: VirtualMachinePreference
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: custom-instancetype-demo
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: custom-instancetype-demo
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: custom-instancetype-demo
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: fedora
              password: changeme123
              chpasswd:
                expire: false
              ssh_pwauth: true
