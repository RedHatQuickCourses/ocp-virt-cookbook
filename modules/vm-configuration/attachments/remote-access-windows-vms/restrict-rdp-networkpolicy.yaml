apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-rdp-access
  namespace: <your-namespace>
spec:
  podSelector:
    matchLabels:
      vm.kubevirt.io/name: <your-vm-name>
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 203.0.113.0/24
    ports:
    - protocol: TCP
      port: 3389
