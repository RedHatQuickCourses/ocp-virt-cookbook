name: Validate and preview PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths-ignore:
      - ".gitignore"
      - "README.md"

concurrency: pr-preview-${{ github.ref }}

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Build site
        run: pnpm run build

      - name: Generate attachments
        run: python tests/generate-attachments.py --all

      - name: Lint YAML manifests
        run: yamllint modules/

      - name: Install oc CLI
        run: |
          curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xzf openshift-client-linux.tar.gz oc
          chmod +x oc

      - name: Dry-run validate manifests
        run: find modules -type f -name '*.yaml' -exec ./oc apply --dry-run=client -f {} +

  preview:
    runs-on: ubuntu-latest
    needs: validate
    if: |
      always() &&
      !github.event.pull_request.head.repo.fork
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Site
        run: pnpm run build

      - name: Publish PR preview to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/site
