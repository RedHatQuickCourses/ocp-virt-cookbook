apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: dualstack-net
  namespace: udn-primary-vm-guests
spec:
  topology: Layer2
  layer2:
    role: Secondary
    mtu: 1400
    subnets:
    - "10.230.0.0/16"
    - "2001:db8:230::/64"
    ipam:
      mode: Enabled
      lifecycle: Persistent
